name: Submit URLs to Search Engines

# Triggers when sitemap or blog content changes on master
on:
  push:
    branches: [master]
    paths:
      - 'sitemap.xml'
      - 'blog/**'
      - '.github/workflows/submit-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages deployment
        run: sleep 90

      - name: Verify sitemap and IndexNow key are live
        run: |
          # IndexNow verifies the site by fetching https://empcaring.com/<key>.txt,
          # so the key file must be named after the key itself, not "indexnow-key.txt".
          KEY=$(tr -d '[:space:]' < indexnow-key.txt)
          echo "key: $KEY"
          S=$(curl -s -o /dev/null -w "%{http_code}" "https://empcaring.com/sitemap.xml")
          K=$(curl -s -o /dev/null -w "%{http_code}" "https://empcaring.com/$KEY.txt")
          B=$(curl -s "https://empcaring.com/$KEY.txt")
          echo "sitemap: HTTP $S / key file: HTTP $K"
          if [ "$S" != "200" ]; then echo "::error::sitemap not reachable (HTTP $S)"; exit 1; fi
          if [ "$K" != "200" ]; then echo "::error::IndexNow key file https://empcaring.com/$KEY.txt not reachable (HTTP $K)"; exit 1; fi
          if [ "$(printf '%s' "$B" | tr -d '[:space:]')" != "$KEY" ]; then echo "::error::key file content does not match the key"; exit 1; fi

      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          KEY=$(tr -d '[:space:]' < indexnow-key.txt)
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          COUNT=$(printf '%s' "$URLS" | jq 'length')
          echo "Submitting $COUNT URLs to IndexNow"
          CODE=$(curl -s -o /tmp/indexnow.out -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"empcaring.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://empcaring.com/$KEY.txt\",\"urlList\":$URLS}")
          echo "IndexNow HTTP $CODE"
          cat /tmp/indexnow.out || true
          if [ "$CODE" != "200" ] && [ "$CODE" != "202" ]; then echo "::error::IndexNow rejected the submission (HTTP $CODE)"; exit 1; fi

      - name: Note about Google
        run: |
          echo "Google ignores IndexNow and deprecated the Bing sitemap ping endpoint in 2022."
          echo "Google discovery relies on the sitemap submitted once in Search Console plus internal links;"
          echo "re-submitting the same sitemap does not speed up indexing."
